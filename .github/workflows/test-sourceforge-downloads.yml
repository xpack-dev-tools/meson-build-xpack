name: 'Test SourceForge downloads'

on:
  schedule:
    - cron: '39 15 * * 6' # every Saturday
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          repository: xpack-dev-tools/xbb-helper-xpack
          ref: 'xpack-development'

      - name: Show environment
        run: |
          ls -lLA
          env | sort | grep -E '^[^ \t]+='

      - name: Run test
        run: |
          #!/usr/bin/env bash
          set -e

          # The script is in the xbb-helper-xpack repo.
          source maintenance-scripts/download-sourceforge-source.sh

          date

          # https://sourceforge.net/projects/meson-build-xpack/files/
          name="meson-build"
          threshold=16383 # (50%)

          # 2024-2022
          platforms="win32-x64,linux-x64,linux-arm64,linux-arm,darwin-x64,darwin-arm64"

          download_sourceforge "${name}" "1.6.1-1" ${threshold} "${platforms}"
          download_sourceforge "${name}" "1.5.2-1" ${threshold} "${platforms}"
          download_sourceforge "${name}" "1.4.2-1" ${threshold} "${platforms}"
          download_sourceforge "${name}" "1.3.2-1" ${threshold} "${platforms}"
          download_sourceforge "${name}" "1.3.0-1" ${threshold} "${platforms}"
          download_sourceforge "${name}" "1.2.3-1" ${threshold} "${platforms}"
          download_sourceforge "${name}" "1.1.1-1" ${threshold} "${platforms}"
          download_sourceforge "${name}" "1.0.2-1" ${threshold} "${platforms}"
          download_sourceforge "${name}" "0.64.1-1" ${threshold} "${platforms}"
          download_sourceforge "${name}" "0.63.3-1" ${threshold} "${platforms}"
          download_sourceforge "${name}" "0.62.2-1" ${threshold} "${platforms}"
          platforms="win32-x64,linux-x64,linux-arm64,linux-arm,darwin-x64,darwin-arm64"
          download_sourceforge "${name}" "0.61.5-1" ${threshold} "${platforms}"
          download_sourceforge "${name}" "0.60.3-1" ${threshold} "${platforms}"

          # 2021
          platforms="win32-x64,win32-ia32,linux-x64,linux-ia32,linux-arm64,linux-arm,darwin-x64"

          download_sourceforge "${name}" "0.59.4-1" ${threshold} "${platforms}"
          download_sourceforge "${name}" "0.58.2-1" ${threshold} "${platforms}"
          download_sourceforge "${name}" "0.57.2-1" ${threshold} "${platforms}"
          download_sourceforge "${name}" "0.56.2-2" ${threshold} "${platforms}"

          # 2020
          platforms="win32-x64,win32-x32,linux-x64,linux-x32,linux-arm64,linux-arm,darwin-x64"

          download_sourceforge "${name}" "0.55.3-2" ${threshold} "${platforms}"
